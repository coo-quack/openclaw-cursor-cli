# A single-package repo with a workspace file, because pnpm 11 reads these
# settings only from here — the equivalents under `pnpm` in package.json are
# accepted and ignored (measured against 11.17.0).
#
# `openclaw` is an optional peer dependency, and pnpm installs it whatever the
# configuration says. Four of the packages it drags in carry build scripts,
# which pnpm blocks and then treats as a hard error, so `pnpm install` exits 1
# until each one has an answer here.
#
# The answer is no. Nothing in this repo executes openclaw from node_modules:
# the package is present so `tsc` and the unit tests can resolve
# `openclaw/plugin-sdk/*`, and the integration suite runs the separately
# installed CLI from PATH. Native builds for a package we never run are cost
# without benefit.
#
# Listing them beats `strictDepBuilds: false`, which was here before. That
# turned the check off for every dependency, present and future; this records a
# decision per package and lets pnpm raise the question again if openclaw ever
# brings in something new. It also stops `pnpm install` rewriting this file
# with `set this to true or false` placeholders on every run.
allowBuilds:
  '@google/genai': false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false
# openclaw (2026.7.1, and 2026.7.1-2 at the time of writing) pins undici 8.5.0
# and tar 7.5.19 exactly — both carry live advisories, and an exact pin leaves
# the lockfile no room to move, so `pnpm audit --fix update` and lock file
# maintenance both resolve straight back to the vulnerable versions. The floor
# here is the lowest patched release of each; the ceiling is the major openclaw
# itself declares (@openclaw/proxyline peers undici `>=8.3.0 <9`), so patches
# keep flowing but a major jump does not arrive ahead of upstream. Delete both
# entries once openclaw ships patched pins of its own.
overrides:
  undici: '>=8.9.0 <9'
  tar: '>=7.5.21 <8'
